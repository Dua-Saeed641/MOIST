AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: MOIST - no-touch moisture glove. Ingest + analytics API, AI brief + questions (OpenRouter, Bedrock fallback), SNS alerts, hosted dashboard.

Parameters:
  WriteApiKey:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Shared secret the gateway sends as x-api-key when posting readings.
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional e-mail for anomaly alerts and the morning brief (confirm the subscription mail).
  BedrockRegion:
    Type: String
    Default: us-east-1
    Description: Region for Amazon Bedrock calls (the us. inference profile routes across US regions).
  OpenRouterKeys:
    Type: String
    Default: ""
    NoEcho: true
    Description: Comma-separated OpenRouter API keys for the AI brief and questions, tried in order (Bedrock is the fallback).
  GatewayUrl:
    Type: String
    Default: ""
    Description: Optional public ngrok URL of the laptop gateway (e.g. https://your-name.ngrok-free.app). Lets the dashboard show whether the glove is plugged in.
  GatewayToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional shared secret the API sends to the gateway status endpoint (same value as the gateway's --status-token).

Conditions:
  HasEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Globals:
  Function:
    Runtime: python3.14
    CodeUri: src/
    Timeout: 29
    MemorySize: 512
    Architectures: [arm64]

Resources:
  ReadingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: area_id, AttributeType: S }
        - { AttributeName: ts, AttributeType: N }
        - { AttributeName: day, AttributeType: S }
      KeySchema:
        - { AttributeName: area_id, KeyType: HASH }
        - { AttributeName: ts, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: byDay
          KeySchema:
            - { AttributeName: day, KeyType: HASH }
            - { AttributeName: ts, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  AreasTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: id, AttributeType: S }]
      KeySchema: [{ AttributeName: id, KeyType: HASH }]

  StateTable:  # action queue + latest brief
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: kind, AttributeType: S }
        - { AttributeName: key, AttributeType: S }
      KeySchema:
        - { AttributeName: kind, KeyType: HASH }
        - { AttributeName: key, KeyType: RANGE }

  AlertTopic:
    Type: AWS::SNS::Topic
  AlertMail:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties: { TopicArn: !Ref AlertTopic, Protocol: email, Endpoint: !Ref AlertEmail }

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings: { ThrottlingBurstLimit: 50, ThrottlingRateLimit: 25 }
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowHeaders: [content-type, x-api-key]
        AllowMethods: [GET, POST, PUT, OPTIONS]

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.handler
      Environment:
        Variables:
          READINGS_TABLE: !Ref ReadingsTable
          AREAS_TABLE: !Ref AreasTable
          STATE_TABLE: !Ref StateTable
          WRITE_API_KEY: !Ref WriteApiKey
          ALERT_TOPIC_ARN: !Ref AlertTopic
          BRIEF_TOPIC_ARN: !Ref AlertTopic
          BEDROCK_REGION: !Ref BedrockRegion
          GATEWAY_URL: !Ref GatewayUrl
          GATEWAY_TOKEN: !Ref GatewayToken
          OPENROUTER_KEYS: !Ref OpenRouterKeys
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ReadingsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AreasTable }
        - DynamoDBCrudPolicy: { TableName: !Ref StateTable }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt AlertTopic.TopicName }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource:
                - arn:aws:bedrock:*::foundation-model/amazon.nova-*
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.amazon.nova-*"
      Events:
        Api: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi } }  # catch-all; app.py routes
        MorningBrief:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(30 6 * * ? *)"
            ScheduleExpressionTimezone: Asia/Kolkata

  ApiLogs:  # keep a week of logs instead of forever
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApiFunction}"
      RetentionInDays: 7

  # Dashboard hosting: private S3 bucket behind CloudFront (HTTPS).
  SiteBucket:
    Type: AWS::S3::Bucket
  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-site"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  SiteCdn:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        PriceClass: PriceClass_200  # edge locations incl. India; cheaper than PriceClass_All
        DefaultRootObject: index.html
        HttpVersion: http2
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref SiteOAC
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # AWS managed CachingOptimized
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteCdn}"

Outputs:
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  DashboardUrl:
    Value: !Sub "https://${SiteCdn.DomainName}"
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref SiteCdn
